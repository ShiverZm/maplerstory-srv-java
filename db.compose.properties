# 供 docker compose 挂载覆盖 /app/config/db.properties
# 使用compose 时请不要改主机上的 config/db.properties 连接信息，由本文件覆盖容器内配置。
# 修改默认密码时请与 docker-compose.yaml 中 MYSQL_ROOT_PASSWORD 保持一致。
driverClassName = com.mysql.jdbc.Driver
url = jdbc:mysql://mysql:3306/maplestory?autoReconnect=true&characterEncoding=UTF-8
username = root
password = maplestory_root
timeout = 300000
